<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda Aula — Reto responsive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Tienda Aula</h1>
    <nav aria-label="Navegación principal">
      <a href="#productos">Productos</a>
      <a href="#nosotros">Nosotros</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <section id="productos" aria-labelledby="titulo-productos">
      <h2 id="titulo-productos">Productos destacados</h2>
      <p>Explora nuestra selección de artículos.</p>

      <div class="productos">
        <article class="tarjeta">
          <div class="foto" aria-hidden="true">🎧</div>
          <h3>Audífonos</h3>
          <p class="precio">$25</p>
          <button type="button" data-nombre="Audífonos">Agregar al carrito</button>
        </article>
        <article class="tarjeta">
          <div class="foto" aria-hidden="true">⌨️</div>
          <h3>Teclado</h3>
          <p class="precio">$30</p>
          <button type="button" data-nombre="Teclado">Agregar al carrito</button>
        </article>
        <article class="tarjeta">
          <div class="foto" aria-hidden="true">🖱️</div>
          <h3>Mouse</h3>
          <p class="precio">$15</p>
          <button type="button" data-nombre="Mouse">Agregar al carrito</button>
        </article>
      </div>

      <p id="estado" role="status" aria-live="polite"></p>
    </section>

    <section id="nosotros" aria-labelledby="titulo-nosotros">
      <h2 id="titulo-nosotros">Nosotros</h2>
      <p>Ejercicio académico de interfaz adaptable.</p>
    </section>
  </main>

  <footer id="contacto">Tienda Aula · Proyecto académico</footer>

  <script>
    var estado = document.getElementById('estado');
    var cantidades = {};

    document.querySelectorAll('.tarjeta button').forEach(function (boton) {
      boton.addEventListener('click', function () {
        var nombre = boton.dataset.nombre;
        cantidades[nombre] = (cantidades[nombre] || 0) + 1;

        // Retroalimentación (R7): mensaje + tarjeta resaltada + botón con confirmación
        estado.textContent = nombre + ' agregado al carrito (' + cantidades[nombre] + ').';
        estado.classList.add('visible');

        var tarjeta = boton.closest('.tarjeta');
        tarjeta.classList.add('agregada');
        boton.textContent = '✔ Agregado (' + cantidades[nombre] + ')';
      });
    });
  </script>
</body>
</html>
